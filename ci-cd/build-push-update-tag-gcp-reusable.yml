name: build-push-update-tag-gcp

env:
  REGISTRY: me-central2-docker.pkg.dev
  # PROJECT_ID/REPOSITORY — confirm workload_project_id once terraform.tfvars
  # is filled in; "core-platform" repository_id comes from envs/prod/main.tf
  REPO_PATH: core-platform-workload-prod/core-platform

on:
  workflow_call: 
    inputs:
      # ... every existing input, unchanged from the OCI workflow — omitted
      # here for brevity. Nothing about app config differs between clouds.
      service_name:
        required: false
        type: string
      service_path:
        required: false
        type: string
      # <<< keep every other existing input exactly as-is >>>

    secrets:
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: true
      GCP_SERVICE_ACCOUNT:
        required: true
      INFRA_REPO_SSH_KEY:
        required: true
      NPM_TOKEN:
        required: true
      SENTRY_DSN:
        required: false
      # <<< every other existing secret (Firebase, Mixpanel, etc.) unchanged >>>

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    outputs:
      sha8: ${{ steps.get-sha8.outputs.sha8 }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Get short SHA
        id: get-sha8
        run: |
          short_sha=$(echo ${GITHUB_SHA} | cut -c1-8)
          echo "sha8=$short_sha" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_PATH }}/${{ inputs.service_name || github.event.repository.name }}

      - id: auth
        name: Authenticate to Google Cloud
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          token_format: 'access_token'
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Login to Artifact Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: ${{ inputs.service_path != '' && format('./{0}', inputs.service_path) || '.' }}
          file: ${{ inputs.service_path != '' && format('./{0}/Dockerfile', inputs.service_path) || 'Dockerfile' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.REPO_PATH }}/${{ inputs.service_name || github.event.repository.name }}:${{ steps.get-sha8.outputs.sha8 }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NPM_TOKEN=${{ secrets.NPM_TOKEN }}
            # <<< every existing build-arg unchanged — all app config, none
            #     of it registry- or cloud-specific >>>

  update-tag:
    # Only ever touches helm-releases/core-platform-gcp/ — never the original
    # helm-releases/core-platform/ path. The two pipelines can never step on
    # each other, by construction, not by discipline.
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v3
        with:
          repository: madkol/Infrastructure
          ssh-key: "${{ secrets.INFRA_REPO_SSH_KEY }}"
        if: github.event_name != 'pull_request'

      - name: Split repository name
        uses: jungwinter/split@v2
        id: split-repo-name
        with:
          msg: ${{ inputs.service_name || github.event.repository.name }}
          separator: '-'
          maxsplit: '1'

      - name: Update GCP prod tag only — production-only scope, no dev/stg branch
        working-directory: GCP/helm-releases/core-platform-gcp/${{ steps.split-repo-name.outputs._1 }}
        run: |
          sed -i --regexp-extended 's|^  tag: "[a-zA-Z0-9]{4,10}"|  tag: "${{ needs.build-push.outputs.sha8 }}"|g' prod.yaml
        if: github.event_name != 'pull_request'

      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "GCP build: update image tag for helm-releases/core-platform-gcp/${{ steps.split-repo-name.outputs._1 }}"
        if: github.event_name != 'pull_request'
