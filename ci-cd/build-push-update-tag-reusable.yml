name: build-push-update-tag

env:
  OCI_REGISTRY: jed.ocir.io
  OCI_REPO_PATH: axvp4vawnqyw
  GCP_REGISTRY: me-central2-docker.pkg.dev
  # PROJECT_ID/REPOSITORY — confirm workload_project_id once terraform.tfvars
  # is filled in; "core-platform" repository_id comes from envs/prod/main.tf
  GCP_REPO_PATH: core-platform-workload-prod/core-platform
  env_var_name_mapping: >
    {
      "prod": "production",
      "stg": "staging",
      "dev": "development",  
    }

on:
  workflow_call:
    inputs:
      # ... every existing input is unchanged, omitted here for brevity —
      # nothing about service_name, SITE_URL, BASE_API_URL, Sentry, Firebase,
      # Apple Pay, Segment, Mixpanel, EmailJS, JWT, Vite inputs changes at all.
      service_name:
        required: false
        type: string
      service_path:
        required: false
        type: string
      # <<< keep every other existing input exactly as-is >>>

    secrets:
      # Both sets required during the transition — OCIR keeps OKE fed,
      # GCP starts feeding GKE from day one. Drop the OCI ones only once
      # OKE is fully decommissioned.
      REGISTRY_USERNAME:
        required: true
      REGISTRY_TOKEN:
        required: true
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: true
      GCP_SERVICE_ACCOUNT:
        required: true
      INFRA_REPO_SSH_KEY:
        required: true
      NPM_TOKEN:
        required: true
      SENTRY_DSN:
        required: false
      # <<< every other existing secret (Firebase, Mixpanel, etc.) unchanged >>>

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      sha8: ${{ steps.get-sha8.outputs.sha8 }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Get short SHA
        id: get-sha8
        run: |
          short_sha=$(echo ${GITHUB_SHA} | cut -c1-8)
          echo "sha8=$short_sha" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.OCI_REGISTRY }}/${{ env.OCI_REPO_PATH }}/${{ inputs.service_name || github.event.repository.name }}

      # --- login to BOTH registries before the single combined push below ---

      - name: Login to OCIR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          registry: ${{ env.OCI_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - id: auth
        name: Authenticate to Google Cloud
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Login to Artifact Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          registry: ${{ env.GCP_REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # --- one build, pushed to both destinations — not two separate builds ---

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: ${{ inputs.service_path != '' && format('./{0}', inputs.service_path) || '.' }}
          file: ${{ inputs.service_path != '' && format('./{0}/Dockerfile', inputs.service_path) || 'Dockerfile' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.OCI_REGISTRY }}/${{ env.OCI_REPO_PATH }}/${{ inputs.service_name || github.event.repository.name }}:${{ steps.get-sha8.outputs.sha8 }}
            ${{ env.GCP_REGISTRY }}/${{ env.GCP_REPO_PATH }}/${{ inputs.service_name || github.event.repository.name }}:${{ steps.get-sha8.outputs.sha8 }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NPM_TOKEN=${{ secrets.NPM_TOKEN }}
            # <<< every existing build-arg unchanged — none of this is
            #     registry- or cloud-specific, it's all app config >>>

  update-tag:
    # UNCHANGED. It bumps a tag string in helm-releases/ and commits — it has
    # no awareness of which registry the tag came from. Whether a given
    # cluster's ArgoCD pulls that tag from OCIR or Artifact Registry is
    # controlled entirely by that service's own image.repository value in its
    # Helm chart — not by this job, and not by anything above it.
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v3
        with:
          repository: madkol/Infrastructure
          ssh-key: "${{ secrets.INFRA_REPO_SSH_KEY }}"
        if: github.event_name != 'pull_request'

      - name: Split repository name
        uses: jungwinter/split@v2
        id: split-repo-name
        with:
          msg: ${{ inputs.service_name || github.event.repository.name }}
          separator: '-'
          maxsplit: '1'

      - name: Update manifests images tag for dev
        working-directory: helm-releases/${{ steps.split-repo-name.outputs._0 }}/${{ steps.split-repo-name.outputs._1 }}
        run: |
          sed -i --regexp-extended 's|^  tag: "[a-zA-Z0-9]{4,10}"|  tag: "${{ needs.build-push.outputs.sha8 }}"|g' dev.yaml
        if: github.ref_name == 'dev'

      - name: Update manifests images tag for stg
        working-directory: helm-releases/${{ steps.split-repo-name.outputs._0 }}/${{ steps.split-repo-name.outputs._1 }}
        run: |
          sed -i --regexp-extended 's|^  tag: "[a-zA-Z0-9]{4,10}"|  tag: "${{ needs.build-push.outputs.sha8 }}"|g' stg.yaml
        if: github.ref_name == 'stg'

      - name: Update manifests images tag for prod
        working-directory: helm-releases/${{ steps.split-repo-name.outputs._0 }}/${{ steps.split-repo-name.outputs._1 }}
        run: |
          sed -i --regexp-extended 's|^  tag: "[a-zA-Z0-9]{4,10}"|  tag: "${{ needs.build-push.outputs.sha8 }}"|g' prod.yaml
        if: github.ref_name == 'prod'

      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: Apply automatic changes for helm-releases/${{ steps.split-repo-name.outputs._0 }}/${{ steps.split-repo-name.outputs._1 }}
        if: github.event_name != 'pull_request'
