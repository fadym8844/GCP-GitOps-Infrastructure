# External Secrets Operator GCP install values
# Version: v0.8.1 (confirmed from live OCI cluster image)
# Chart: external-secrets (matching version)
#
# KEY CHANGE from original plan: using GCP Secret Manager instead of OCI Vault
# Reason: GCP must be fully independent - OCI outages must not affect GCP secrets
#
# No OCI credentials needed - ESO authenticates to GCP Secret Manager via
# Workload Identity automatically. The GKE node pool already has
# cloud-platform oauth scope.
#
# REQUIRED before installing: grant ESO access to Secret Manager
#   gcloud projects add-iam-policy-binding core-platform-workload-prod \
#     --member="serviceAccount:<node-pool-service-account>" \
#     --role="roles/secretmanager.secretAccessor"
#
# Or more precisely scoped (recommended):
#   gcloud projects add-iam-policy-binding core-platform-workload-prod \
#     --member="serviceAccount:core-platform-workload-prod.svc.id.goog[external-secrets/external-secrets]" \
#     --role="roles/secretmanager.secretAccessor"
#
# Install command:
#   helm repo add external-secrets https://charts.external-secrets.io
#   helm install external-secrets external-secrets/external-secrets --version 0.8.1 \
#     -n external-secrets --create-namespace \
#     -f values-external-secrets-gcp.yaml

replicaCount: 1
 
image:
  repository: ghcr.io/external-secrets/external-secrets
  tag: v0.8.1  # confirmed from live OCI cluster

installCRDs: true

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 256Mi

certController:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

# Workload Identity - tells ESO pod to use GKE metadata server for auth
serviceAccount:
  annotations:
    iam.gke.io/workload-identity: "core-platform-workload-prod.svc.id.goog[external-secrets/external-secrets]"
