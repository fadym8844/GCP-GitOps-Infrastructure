# ClusterSecretStore for GCP - reads from GCP Secret Manager
# NOT from OCI Vault - GCP must be fully independent so OCI outages don't affect it
#
# Apply after external-secrets is running:
#   kubectl apply -f clustersecretstore-gcp.yaml
#
# No credentials needed - uses Workload Identity automatically
# The GKE node pool already has cloud-platform scope, so ESO can access
# Secret Manager in core-platform-workload-prod without any extra setup

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager-store 
spec:
  provider:
    gcpsm:
      projectID: core-platform-workload-prod
