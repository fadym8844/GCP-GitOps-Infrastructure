apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: core-platform-website-tls
  namespace: core-platform
spec:
  secretName: core-platform-website-tls
  issuerRef:
    name: acme-http-issuer-traefik
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - core-platform.com
    - www.core-platform.com
 
