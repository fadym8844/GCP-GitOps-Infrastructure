apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rabbitmq-traefik-cert-prod
  namespace: rabbitmq-system
spec:
  dnsNames:
    - rabbitmqgcp.core-platform.com
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: acme-http-issuer-traefik
  secretName: rabbitmq-traefik-cert-prod
 