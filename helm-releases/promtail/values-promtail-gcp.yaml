# Promtail GCP install values
# Version: 2.7.2 (confirmed from live OCI cluster: docker.io/grafana/promtail:2.7.2)
# Chart: promtail matching version
#
# Not Helm-managed on OCI - was raw kubectl/ArgoCD directory
# Building as proper Helm for GCP 
#
# Install command:
#   helm repo add grafana https://grafana.github.io/helm-charts
#   helm install promtail grafana/promtail --version 6.8.x \
#     -n monitoring --create-namespace \
#     -f values-promtail-gcp.yaml

image:
  tag: 2.7.2

# Matches OCI resource requests (100m/128Mi confirmed from resource dump)
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

config:
  clients:
    - url: http://loki-loki-distributed-gateway.monitoring/loki/api/v1/push

daemonset:
  enabled: true
  tolerations:
    - effect: NoSchedule
      operator: Exists
