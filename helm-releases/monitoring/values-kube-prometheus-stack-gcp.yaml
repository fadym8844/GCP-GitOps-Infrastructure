# kube-prometheus-stack GCP install values
# Prometheus version: v2.40.5 (confirmed from live OCI cluster)
# Matching chart: kube-prometheus-stack-43.x (ships prometheus v2.40.5)
#
# Not Helm-managed on OCI - was raw kubectl/ArgoCD directory
# Building as proper Helm for GCP
#
# Install command:
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm install monitoring prometheus-community/kube-prometheus-stack --version 43.2.1 \
#     -n monitoring --create-namespace \
#     -f values-kube-prometheus-stack-gcp.yaml

prometheus:
  prometheusSpec:
    image:
      tag: v2.40.5 
    replicas: 2  # matches OCI (2 StatefulSet replicas confirmed)
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard-rwo
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi
    resources:
      requests:
        cpu: 200m
        memory: 400Mi

alertmanager:
  alertmanagerSpec:
    replicas: 1
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: standard-rwo
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 200Mi

grafana:
  image:
    tag: "9.3.1"  # confirmed from live OCI cluster
  # Admin password - confirmed from live OCI cluster
  adminPassword: "WgT6ItAP3xUOB2ZKYvvK14y2IwFbCjyMk1P5kgY"
  ingress:
    enabled: false  # Gateway API HTTPRoute handles monitoring.core-platform.com
  persistence:
    enabled: true
    storageClassName: standard-rwo
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

# Node exporter - DaemonSet, one per node
nodeExporter:
  enabled: true

# kube-state-metrics
kubeStateMetrics:
  enabled: true

# Disable components already handled by GKE natively
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false

alertmanager:
  config:
    global:
      resolve_timeout: 5m
      slack_api_url: https://example.com/slack-webhook-placeholder
    inhibit_rules:
    - equal:
      - namespace
      - alertname
      source_matchers:
      - severity = critical
      target_matchers:
      - severity =~ warning|info
    - equal:
      - namespace
      - alertname
      source_matchers:
      - severity = warning
      target_matchers:
      - severity = info
    receivers:
    - name: "null"
    - name: slack
      slack_configs:
      - channel: '#alerts-gcp-prod'
        text: '{{ template "slack.myorg.text" . }}'
        title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] Alert {{ .CommonLabels.alertname }}'
    route:
      group_by:
      - namespace
      group_interval: 5m
      group_wait: 30s
      receiver: slack
      repeat_interval: 12h
      routes:
      - matchers:
        - alertname =~ "InfoInhibitor|Watchdog"
        receiver: "null"
  templateFiles:
    template_1.tmpl: |-
      {{ define "slack.myorg.text" }}
      {{ range .Alerts }}
      *Alert:* {{ .Annotations.summary }} - `{{ .Labels.severity }}`
      *Cluster:* https://argocd.core-platform.com
      *Description:* {{ .Annotations.description }}
      *Graph:* <{{ .GeneratorURL }}|:chart_with_upwards_trend:>
      *Runbook:* {{ .Annotations.runbook_url }}
      *Details:*
        {{ range .Labels.SortedPairs }} • *{{ .Name }}:* `{{ .Value }}`
        {{ end }}
      {{ end }}
      {{ end }}

kubeProxy:
  enabled: false
