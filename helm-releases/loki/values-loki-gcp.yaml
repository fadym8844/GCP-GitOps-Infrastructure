# Loki GCP install values
# Version: 2.7.3 (confirmed from live OCI cluster: docker.io/grafana/loki:2.7.3)
# Mode: microservices (read + write separate StatefulSets, confirmed from OCI)
# Chart: loki-distributed (matching loki 2.7.3)
#
# Not Helm-managed on OCI - was raw kubectl/ArgoCD directory
# Building as proper Helm for GCP
#
# Install command:
#   helm repo add grafana https://grafana.github.io/helm-charts
#   helm install loki grafana/loki-distributed --version 0.69.x \
#     -n monitoring --create-namespace \
#     -f values-loki-gcp.yaml 

loki:
  image:
    tag: 2.7.3
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem  # start simple, upgrade to GCS later if needed

read:
  replicas: 3  # matches OCI (loki-read: 3/3 confirmed)
  persistence:
    storageClass: standard-rwo
    size: 10Gi

write:
  replicas: 3  # matches OCI (loki-write: 3/3 confirmed)
  persistence:
    storageClass: standard-rwo
    size: 10Gi

gateway:
  enabled: true
  replicas: 1
  image:
    tag: "1.23"

# Table manager not needed with filesystem storage
tableManager:
  enabled: false
