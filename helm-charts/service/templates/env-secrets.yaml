{{- if .Values.envSecret -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "service.fullname" . }}-env-secret
  namespace: {{ $.Release.Namespace }}
spec:
  refreshInterval: "30m"
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecretVaultName }}
  target:
    name: {{ include "service.fullname" . }}-env-secret
    creationPolicy: Owner
  data:
{{- range $key, $value := .Values.envSecret }}
  - secretKey: {{ $key }}
    remoteRef: 
      key: {{ $key }}
{{- end }}
{{- end }}
{{- if .Values.envSecretPlainText }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "service.fullname" . }}-env-plain-text-secret
  namespace: {{ $.Release.Namespace }}
stringData:
{{ toYaml .Values.envSecretPlainText | indent 2 }}
type: Opaque
{{- end }}

