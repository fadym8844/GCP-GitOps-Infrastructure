{{- if .Values.routes.enabled }}
{{- range $name, $hostCfg := .Values.routes.hosts }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "%s-%s" $.Release.Name $name | trunc 63 | trimSuffix "-" }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $.Release.Name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
spec:
  parentRefs:
    - name: {{ $.Release.Name }}-gateway 
      sectionName: https
  hostnames:
    - {{ $hostCfg.host | quote }}
  rules:
{{- range $r := $hostCfg.routes }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ $r.pathPrefix }}
      backendRefs:
        - name: {{ $r.service }}
          port: {{ $r.port }}
{{- end }}
{{- end }}
{{- end }}

{{- if .Values.gateway.httpRedirect }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-http-to-https-redirect
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  parentRefs:
    - name: {{ .Release.Name }}-gateway
      sectionName: http
  hostnames:
    # Replaces Traefik's redirect-to-https middleware, native to Gateway API.
{{- range $name, $hostCfg := .Values.routes.hosts }}
    - {{ $hostCfg.host | quote }}
{{- end }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
