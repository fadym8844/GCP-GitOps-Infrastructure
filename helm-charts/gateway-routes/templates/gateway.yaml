{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Release.Name }}-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  gatewayClassName: gke-l7-regional-external-managed
  addresses:
    - type: NamedAddress
      value: {{ .Values.gateway.ipName }} 
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        # Multiple certs on one listener - GKE resolves the right one via
        # SNI automatically. Matches the real structure confirmed on OKE:
        # one multi-SAN cert for the 6 app-facing hosts, plus 3 separate
        # single-domain certs for cd/monitoring/rabbitmq - not 1 combined
        # cert and not 9 separate ones.
        certificateRefs:
{{- range .Values.gateway.tlsSecretNames }}
          - kind: Secret
            name: {{ . }}
{{- end }}
      allowedRoutes:
        namespaces:
          from: Same
{{- if .Values.gateway.httpRedirect }}
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
{{- end }}
{{- end }}

